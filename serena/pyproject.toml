[project]
name = "serena"
version = "0.1.0"
description = "MiroFish Trading — research-grade, local-first financial multi-agent simulation. Phase 1: research/backtesting/paper trading only, live execution disabled by default."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
