[project]
name = "serena"
version = "0.1.0"
description = "MiroFish Trading — research-grade, local-first financial multi-agent simulation. Phase 1: research/backtesting/paper trading only, live execution disabled by default."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "kuzu>=0.11.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "camel-oasis==0.2.5",
    # camel-ai==0.2.78 (pulled in by camel-oasis==0.2.5) under-constrains its own `mcp` dependency:
    # uv resolves to mcp==2.0.0 by default, which removed `FastMCP` from `mcp.server` and breaks
    # `import oasis` at camel/toolkits/base.py — VERIFIED live in this environment (Fase 6). Pinning
    # below 2.0 here is the fix, re-verify if camel-ai is ever upgraded past 0.2.78.
    "mcp<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
neo4j = [
    "neo4j>=5.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
