name: Ciclo di trading

# Un passaggio dell'Autopilot reale (stesso motore del browser, src/): prezzi live quando
# disponibili, giudizio Gemini quando GEMINI_API_KEY e' configurata come secret, altrimenti solo
# la regola tecnica. Aggiorna data/account.json (conto demo) e la parte di data/research.json di
# sua competenza (trackRecord/tradeEpisodes/lessons) — mai validated/historyCache, di proprieta'
# del job "setup giornaliero" (daily-setup.yml).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aurora-markets-jobs
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze backend
        working-directory: server
        run: npm install --omit=dev

      - name: Installa Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Esegui il ciclo di trading
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node server/jobs/tradingCycle.js

      - name: Salva lo stato aggiornato nel repo
        run: |
          git config user.name "aurora-markets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/account.json data/research.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Ciclo di trading: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push fallito (tentativo $attempt), riprovo dopo un pull --rebase"
            git pull --rebase origin main
          done
          git push origin HEAD:main
